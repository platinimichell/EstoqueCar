<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoqueCar — Login</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body {
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand .icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .login-brand h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .login-brand span {
      color: var(--accent);
    }

    .login-brand p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .alert-first-login {
      background: rgba(230, 57, 70, 0.08);
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 16px;
      display: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-brand">
      <div class="icon">🔧</div>
      <h1>Estoque<span>Car</span></h1>
      <p>Gestão de Estoque para Oficinas</p>
    </div>

    <div id="alertFirstLogin" class="alert-first-login">
      Primeiro acesso detectado. Por favor, altere sua senha antes de continuar.
    </div>

    <!-- Formulário de Login -->
    <div id="formLogin">
      <div class="form-group">
        <label class="form-label" for="email">E-mail <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="seu@email.com" autocomplete="email">
        <span class="form-error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••"
          autocomplete="current-password">
        <span class="form-error" id="passwordError"></span>
      </div>

      <div id="loginError" class="form-error mb-2" style="font-size:0.85rem;"></div>

      <button class="btn btn-primary w-full btn-lg" id="btnLogin" onclick="handleLogin()">
        <span id="loginBtnText">Entrar</span>
        <div id="loginSpinner" class="spinner hidden"
          style="width:18px;height:18px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></div>
      </button>
    </div>

    <!-- Formulário de Troca de Senha (primeiro login) -->
    <div id="formChangePassword" style="display:none;">
      <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text-primary);">Defina sua nova senha
      </h3>

      <div class="form-group">
        <label class="form-label">Senha Atual <span class="required">*</span></label>
        <input type="password" id="currentPwd" class="form-control" placeholder="Mudar123@">
      </div>

      <div class="form-group">
        <label class="form-label">Nova Senha <span class="required">*</span></label>
        <input type="password" id="newPwd" class="form-control"
          placeholder="Mínimo 8 chars, maiúscula, número, símbolo">
        <span class="form-error" id="newPwdError"></span>
      </div>

      <div class="form-group">
        <label class="form-label">Confirmar Nova Senha <span class="required">*</span></label>
        <input type="password" id="confirmPwd" class="form-control" placeholder="Repita a nova senha">
        <span class="form-error" id="confirmPwdError"></span>
      </div>

      <div id="changePwdError" class="form-error mb-2" style="font-size:0.85rem;"></div>

      <button class="btn btn-primary w-full" onclick="handleChangePassword()">
        Salvar Nova Senha e Entrar
      </button>
    </div>

    <div class="login-footer">
      Fatec Cotia — DSM 2026
    </div>
  </div>


  <script type="module" src="assets/js/api.js"></script>
  <script type="module" src="assets/js/auth.js"></script>

</body>

</html>
