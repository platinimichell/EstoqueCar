name: Build and deploy Node.js app to Azure Web App - estoquecar

on:
push:
branches:
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: read

```
steps:
  - uses: actions/checkout@v4

  - name: Set up Node.js version
    uses: actions/setup-node@v4
    with:
      node-version: '22.x'
      cache: 'npm'
      cache-dependency-path: backend/package-lock.json

  - name: Install dependencies
    working-directory: ./backend
    run: npm install

  - name: Build application
    working-directory: ./backend
    run: npm run build --if-present

  - name: Run tests
    working-directory: ./backend
    run: npm run test --if-present

  - name: Upload artifact for deployment job
    uses: actions/upload-artifact@v4
    with:
      name: node-app
      path: ./backend
```

deploy:
runs-on: ubuntu-latest
needs: build

```
permissions:
  id-token: write
  contents: read

steps:
  - name: Download artifact from build job
    uses: actions/download-artifact@v4
    with:
      name: node-app

  - name: Login to Azure
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B485C0EABCA54636AA79F288B4592F40 }}
      tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DD40D20260ED442AA2C228567B624C57 }}
      subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_158D4DEA7CDE4C89AD7F62C0F4E9046D }}

  - name: Deploy to Azure Web App
    id: deploy-to-webapp
    uses: azure/webapps-deploy@v3
    with:
      app-name: 'estoquecar'
      slot-name: 'Production'
      package: .
```
